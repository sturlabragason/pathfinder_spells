<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110c">
    <title>Caladrel's spell drawer · Ecthëlion, Wizard 7</title>
    <meta name="description" content="The spellbook of Caladrel Ecthëlion, elf Wizard 7, Conjurer (Teleportation): 105 spells as index cards.">
    <link rel="preload" href="../fonts/CourierPrime-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/CourierPrime-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../catalog.css">
    <link rel="stylesheet" href="../spells.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <header class="front">
        <div class="plate">
            <div class="plate-label">
                <h1>ECTHËLION, Caladrel</h1>
                <p>Spellbook · Wizard 7 · Conjurer (Teleportation)</p>
            </div>
        </div>
        <nav class="crumbs" aria-label="Elsewhere">
            <a href="https://caladrel.sturlabragason.online/">Character sheet</a>
            <a href="../">All wizard spells</a>
        </nav>
    </header>

    <div class="rail">
    <div class="guides" role="tablist" aria-label="Spell level" id="tabs"></div>
    <div class="guide-rule" id="tabRule"></div>
    </div>

    <main class="drawer" id="drawer">
        <section class="card finder" aria-labelledby="finderTitle">
            <div class="card-head">
                <span class="call">FIND</span>
                <h2 id="finderTitle">Look up a spell</h2>
                <span class="aside" id="total"></span>
            </div>
            <div class="search">
                <label for="q" class="visually-hidden">Search by name or summary</label>
                <span id="searchIcon"></span>
                <input id="q" class="field" type="search" placeholder="Name or summary, e.g. pit" autocomplete="off" spellcheck="false">
            </div>
            <fieldset class="chips" id="schools">
                <legend>School</legend>
            </fieldset>
            <div class="finder-row">
                <p class="tally" id="tally" aria-live="polite"></p>
            </div>
        </section>

        <div id="levels" class="levels" role="tabpanel">
            <div class="card notice" id="status" role="status">
                <div class="card-head"><span class="call">WAIT</span><h2>Pulling the cards…</h2><span class="aside"></span></div>
                <p>Reading spellbook.json.</p>
            </div>
        </div>
    </main>

    <script src="../cards.js"></script>
    <script src="drawer.js"></script>
</body>
</html>
