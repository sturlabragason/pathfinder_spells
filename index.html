<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17110c">
    <title>Pathfinder sorcerer/wizard spells · card catalogue</title>
    <meta name="description" content="Every Pathfinder 1e sorcerer/wizard spell as an index card: search, filter by level and school, rules text and d20pfsrd links.">
    <link rel="preload" href="fonts/CourierPrime-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/CourierPrime-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="catalog.css">
    <link rel="stylesheet" href="spells.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <header class="front">
        <div class="plate">
            <div class="plate-label">
                <h1>SPELLS, Sorcerer &amp; Wizard</h1>
                <p>Pathfinder 1e · levels 0 to 9 · one card per spell</p>
            </div>
        </div>
        <nav class="crumbs" aria-label="Elsewhere">
            <a href="caladrel_ecthelion/">Caladrel's spell drawer</a>
            <a href="https://www.d20pfsrd.com/magic/spell-lists-and-domains/spell-lists-sorcerer-and-wizard/" target="_blank" rel="noopener">d20pfsrd</a>
        </nav>
    </header>

    <div class="rail">
    <div class="guides" role="tablist" aria-label="Sorcerer/wizard spell level" id="tabs"></div>
    <div class="guide-rule" id="tabRule"></div>
    </div>

    <main class="drawer" id="drawer">
        <section class="card finder" aria-labelledby="finderTitle">
            <div class="card-head">
                <span class="call">FIND</span>
                <h2 id="finderTitle">Look up a spell</h2>
                <span class="aside" id="total"></span>
            </div>
            <div class="search">
                <label for="q" class="visually-hidden">Search by name or rules text</label>
                <span id="searchIcon"></span>
                <input id="q" class="field" type="search" placeholder="Name or rules text" autocomplete="off" spellcheck="false">
            </div>
            <fieldset class="chips" id="schools">
                <legend>School</legend>
            </fieldset>
            <div class="finder-row">
                <button type="button" class="key toggle" id="mine" aria-pressed="false">In Caladrel's book</button>
                <p class="tally" id="tally" aria-live="polite"></p>
            </div>
        </section>

        <div class="stack" id="results" role="tabpanel">
            <div class="card notice" id="status" role="status">
                <div class="card-head"><span class="call">WAIT</span><h2>Pulling the cards…</h2><span class="aside"></span></div>
                <p id="progress">Reading spells.tsv (about 6 MB).</p>
            </div>
        </div>
        <div class="drawer-foot" id="foot" hidden>
            <button type="button" class="key" id="more">Show more cards</button>
            <div class="sentinel" id="sentinel"></div>
        </div>
    </main>

    <script src="cards.js"></script>
    <script src="spells.js"></script>
</body>
</html>
